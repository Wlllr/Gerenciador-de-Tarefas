<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-8">
                <h1 class="mb-4">Lista de Tarefas</h1>
            </div>
            <div class="col-4 text-right">
                <a th:href="@{/adicionar}" class="btn btn-primary">+ Adicionar Nova Tarefa</a>
            </div>
        </div>
        <hr>

        <div th:if="${mensagemSucesso}" class="alert alert-success" role="alert" th:text="${mensagemSucesso}">
            Tarefa salva com sucesso!
        </div>

        <form th:action="@{/buscar}" th:object="${tarefa}" method="post" class="form-inline mb-3">
            <input type="text" th:field="*{title}" class="form-control mr-2" placeholder="Buscar por titulo">
            <button type="submit" class="btn btn-secondary">Buscar</button>
        </form>

        <table class="table table-striped table-hover">
            <thead class="thead-dark">
            <tr>
                <th>ID</th>
                <th>Título</th>
                <th>Descrição</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="tarefa : ${tarefas}">
                <td th:text="${tarefa.id}">1</td>
                <td th:text="${tarefa.title}"></td>
                <td th:text="${tarefa.desc}"></td>
                <td>
                <span th:classappend="${tarefa.done ? 'badge badge-success' : 'badge badge-warning'}"
                      th:text="${tarefa.getStatus()}">Pendente</span>
                </td>
                <td>
                    <a th:href="@{/editar/{id}(id=${tarefa.id})}" class="btn btn-sm btn-info">Editar</a>
                    <a th:href="@{/excluir/{id}(id=${tarefa.id})}" class="btn btn-sm btn-danger"
                       onclick="return confirm('Tem certeza que deseja excluir esta tarefa?')">Excluir</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
