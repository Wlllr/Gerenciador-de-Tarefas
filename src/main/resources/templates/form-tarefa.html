<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${tarefa.id == null} ? 'Adicionar Tarefa' : 'Editar Tarefa'"></title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1 th:text="${tarefa.id == null} ? 'Adicionar Nova Tarefa' : 'Editar Tarefa'"></h1>
    <hr>

    <form action="#" th:action="@{/salvar}" th:object="${tarefa}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label for="titulo">Título:</label>
            <input type="text" th:field="*{title}" id="titulo" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="descricao">Descrição (Opcional):</label>
            <textarea th:field="*{desc}" id="descricao" class="form-control" rows="3"></textarea>
        </div>

        <div class="form-group" th:if="${tarefa.id != null}">
            <div class="form-check">
                <input type="checkbox" th:field="*{done}" id="concluida" class="form-check-input">
                <label class="form-check-label" for="concluida">Tarefa Concluída?</label>
            </div>
        </div>

        <button type="submit" class="btn btn-success">Salvar Tarefa</button>
        <a th:href="@{/}" class="btn btn-secondary">Cancelar e Voltar</a>
    </form>
</div>
</body>
</html>
